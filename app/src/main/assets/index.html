<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lite TV Home</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--ink:#f2f5fa;--mute:#9aa7bd;--acc:#3b82ff;--panel:#111a2c;
--hero:linear-gradient(115deg,#0a1020 0%,#16294d 40%,#5a3560 72%,#e08a5a 100%)}
html{font-size:clamp(10px,1.05vw,22px);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:#080d18;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;height:100vh}
#app{display:flex;height:100%}
aside{width:5rem;display:flex;flex-direction:column;align-items:center;gap:2.6rem;padding-top:3.2rem;background:#0a1120;flex:none}
aside svg{width:1.7rem;height:1.7rem;stroke:var(--mute);fill:none;stroke-width:1.8}
aside .on svg{stroke:#fff}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:1.4rem 2.2rem 3rem 2rem;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
header{display:flex;align-items:center;gap:1.2rem;margin-bottom:1.2rem}
header .sp{flex:1}
.f{outline:none;border:0;color:inherit;font:inherit;cursor:pointer;text-decoration:none;transition:transform .12s}
.f:focus{box-shadow:0 0 0 .22rem var(--acc);transform:scale(1.06);z-index:2;position:relative}
.tab{padding:.7rem 1.6rem;border-radius:2rem;background:transparent;color:var(--mute);font-size:1.15rem}
.tab.cur{background:#243046;color:#fff}
.ic{width:2.4rem;height:2.4rem;border-radius:50%;background:#1a2438;display:grid;place-items:center}
.ic svg{width:1.2rem;height:1.2rem;stroke:#fff;fill:none;stroke-width:1.8}
#clock{font-size:1.2rem}
.hero{height:20rem;border-radius:1.2rem;background:var(--hero);padding:2.6rem 3rem;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-6rem;top:-8rem;width:34rem;height:34rem;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 65%)}
.hero>*{position:relative;z-index:1}
.src{font-weight:700;letter-spacing:.04em;font-size:1.1rem}
.src b{color:#e50914;margin-right:.4rem}
.hero h1{font-size:4.6rem;line-height:1;margin:.6rem 0 .8rem;font-weight:800;letter-spacing:-.02em}
.meta{color:#d4dbe8;font-size:1.1rem}
.desc{color:#c3ccdb;font-size:1.1rem;max-width:30rem;margin:.5rem 0 1.2rem}
.btn{padding:.8rem 2.2rem;border-radius:2rem;font-size:1.15rem;font-weight:600;background:rgba(255,255,255,.16);display:inline-block;margin-right:.8rem}
.btn.p{background:#fff;color:#000}
.dots{position:absolute;left:50%;bottom:1rem;display:flex;gap:.5rem;z-index:1}
.dots i{width:.55rem;height:.55rem;border-radius:50%;background:#ffffff55}
.dots i:first-child{width:1.4rem;border-radius:1rem;background:#fff}
.row{display:flex;gap:1rem;overflow:hidden;padding:.9rem .5rem;margin:0 -.5rem}
.apps{background:var(--panel);border-radius:1.4rem;margin-top:1rem;padding:1.1rem 1.2rem}
.apps .row{padding:.5rem}
.app{flex:none;width:9.6rem;text-align:center;font-size:.95rem;color:var(--mute);background:none;border-radius:1rem}
.app .t{height:5.6rem;border-radius:1rem;display:grid;place-items:center;font-weight:800;font-size:1.5rem;margin-bottom:.45rem}
.app:focus{color:#fff}
h2{font-size:1.35rem;font-weight:600;margin:1.4rem 0 .1rem}
.card{flex:none;width:19rem;height:10.4rem;border-radius:.9rem;padding:.9rem 1rem;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;position:relative;overflow:hidden}
.card.s{width:12.5rem;height:17rem}
.card b{font-size:1.2rem;font-weight:700;text-shadow:0 1px 6px #000a}
.card small{color:#dde3ee;font-size:.85rem}
.bar{position:absolute;left:1rem;right:1rem;bottom:.55rem;height:.2rem;background:#fff4;border-radius:1rem}
.bar i{display:block;height:100%;background:var(--acc);border-radius:1rem}
.wp{display:flex;align-items:center;gap:1rem;margin-top:1.2rem;color:var(--mute);font-size:1rem}
.chip{width:5.4rem;height:3rem;border-radius:.6rem}
</style>
</head>
<body>
<div id="app">
<aside>
<div class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg></div>
<div><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M8 2l4 4 4-4"/></svg></div>
<div><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18"/></svg></div>
<div><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div>
<div><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></div>
</aside>
<main id="main">
<header>
<span class="ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></span>
<button class="f tab cur" data-r="0">Home</button>
<button class="f tab" data-r="0">Movies</button>
<button class="f tab" data-r="0">TV Shows</button>
<button class="f tab" data-r="0">Apps</button>
<button class="f tab" data-r="0">Settings</button>
<span class="sp"></span>
<span id="clock">20:45</span>
</header>

<section class="hero">
<div class="src"><b>N</b>NETFLIX</div>
<h1>Your Featured Title</h1>
<div class="meta">Action · Thriller · 2026</div>
<p class="desc">Edit this text in the page to show whatever you like.</p>
<button class="f btn p" data-r="1">▶ Play</button><button class="f btn" data-r="1">More Info</button>
<div class="dots"><i></i><i></i><i></i><i></i></div>
</section>

<section class="apps"><div class="row" id="apps"></div></section>

<h2>Continue Watching</h2>
<div class="row" id="cont"></div>
<h2>Trending Now</h2>
<div class="row" id="trend"></div>

<div class="wp">Change wallpaper
<button class="f chip" data-r="5" data-w="0" style="background:linear-gradient(115deg,#0a1020,#16294d,#5a3560,#e08a5a)"></button>
<button class="f chip" data-r="5" data-w="1" style="background:linear-gradient(115deg,#05060d,#2a1450,#7a2f8f)"></button>
<button class="f chip" data-r="5" data-w="2" style="background:linear-gradient(115deg,#061a1f,#0e4a55,#2fa38a)"></button>
</div>
</main>
</div>
<script>
var APPS=[
["Netflix","N","#000","#e50914","https://www.netflix.com"],
["YouTube","YouTube","#fff","#e00","https://www.youtube.com/tv"],
["Prime Video","prime","#1a98ff","#fff","https://www.primevideo.com"],
["Disney+","Disney+","#0b2a6b","#fff","https://www.disneyplus.com"],
["Shahid","شاهد","#16b3c4","#fff","https://shahid.mbc.net"],
["beIN connect","beIN","#5b2bb3","#fff","https://connect.bein.com"],
["Spotify","Spotify","#000","#1ed760","https://open.spotify.com"],
["tivi","tivi","#f5b400","#fff","#"],
["VPlay","VP","#0c0c14","#a855f7","#"]
];
var CONT=[["Show One","S1 E3 · 56 min left",40,"#3b4a2f,#10130d"],["Show Two","S4 E6 · 32 min left",70,"#8a6a10,#1a1405"],["Show Three","S8 E4 · 28 min left",25,"#2b3447,#0b0f18"],["Show Four","S5 E2 · 41 min left",55,"#8a1c1c,#1a0707"]];
var TREND=[["Title A","#7a1010,#1b0505"],["Title B","#2b1f4d,#0a0716"],["Title C","#6b5232,#14100a"],["Title D","#2f3a2a,#0c120a"],["Title E","#b0752a,#1c1206"],["Title F","#8a1a1a,#16050a"],["Title G","#1f3f5f,#07101a"]];
var WP=[
"linear-gradient(115deg,#0a1020 0%,#16294d 40%,#5a3560 72%,#e08a5a 100%)",
"linear-gradient(115deg,#05060d 0%,#2a1450 50%,#7a2f8f 100%)",
"linear-gradient(115deg,#061a1f 0%,#0e4a55 55%,#2fa38a 100%)"];
function g(c){return "linear-gradient(160deg,"+c.split(",")[0]+","+c.split(",")[1]+")"}
var h="";
APPS.forEach(function(a){h+='<a class="f app" data-r="2" href="'+a[4]+'"><div class="t" style="background:'+a[2]+';color:'+a[3]+'">'+a[1]+'</div>'+a[0]+'</a>'});
document.getElementById("apps").innerHTML=h;
h="";CONT.forEach(function(c){h+='<button class="f card" data-r="3" style="background:'+g(c[3])+'"><b>'+c[0]+'</b><small>'+c[1]+'</small><span class="bar"><i style="width:'+c[2]+'%"></i></span></button>'});
document.getElementById("cont").innerHTML=h;
h="";TREND.forEach(function(c){h+='<button class="f card s" data-r="4" style="background:'+g(c[1])+'"><b>'+c[0]+'</b></button>'});
document.getElementById("trend").innerHTML=h;

function setWP(i){document.documentElement.style.setProperty("--hero",WP[i]);try{localStorage.setItem("wp",i)}catch(e){}}
try{var s=localStorage.getItem("wp");if(s!==null)setWP(+s)}catch(e){}
Array.prototype.forEach.call(document.querySelectorAll("[data-w]"),function(b){b.onclick=function(){setWP(+b.dataset.w)}});

function tick(){var d=new Date();document.getElementById("clock").textContent=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
tick();setInterval(tick,30000);

function rows(){var o={};Array.prototype.forEach.call(document.querySelectorAll(".f"),function(e){(o[e.dataset.r]=o[e.dataset.r]||[]).push(e)});return Object.keys(o).sort().map(function(k){return o[k]})}
var R=rows(),r=2,c=0;
function go(){r=Math.max(0,Math.min(R.length-1,r));c=Math.max(0,Math.min(R[r].length-1,c));var e=R[r][c];e.focus({preventScroll:true});e.scrollIntoView({block:"nearest",inline:"nearest"})}
addEventListener("keydown",function(e){
var k=e.key;
if(k==="ArrowRight")c++;else if(k==="ArrowLeft")c--;else if(k==="ArrowDown"){r++;}else if(k==="ArrowUp"){r--;}else return;
e.preventDefault();go();
});
go();
</script>
</body>
</html>
